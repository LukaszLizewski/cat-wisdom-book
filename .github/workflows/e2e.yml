name: E2E tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CI: 'true'
      PORT: '8080'
      E2E_BASE_URL: http://localhost:8080
      APP_STATIC_DIR: ${{ github.workspace }}/frontend/dist
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start app and wait for readiness
        env:
          APP_DATA_DIR: ${{ runner.temp }}/e2e-data
          APP_MODELS_DIR: ${{ runner.temp }}/e2e-models
        run: |
          mkdir -p "$APP_DATA_DIR" "$APP_MODELS_DIR"
          node backend/src/server.js > "$RUNNER_TEMP/backend.log" 2>&1 &
          app_pid=$!
          for attempt in {1..60}; do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/backend.log"
              exit 1
            fi
            if curl --fail --silent --max-time 2 "$E2E_BASE_URL/login" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/backend.log"
          echo "App did not become ready in time."
          exit 1

      - name: Run E2E tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report and app log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
            ${{ runner.temp }}/backend.log
          retention-days: 7
